<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chemokine–Chemokine Receptor Database</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="nav-left">
      <img src="assets/chemokinedb.png" alt="Logo" />
      <a class="brand" href="index.html">Chemokine Database</a>
    </div>
    <div class="nav-right">
      <a href="index.html">Home</a>
      <a href="https://romanschlimgen.github.io/ckrmodeling/" target="_blank" rel="noopener">Paper</a>
    </div>
  </nav>

  <div class="hero">
    <img src="assets/header.png" alt="Chemokine Database" />
  </div>

  <main>
    <h2 class="page-title">Check out the paper!</h2>
    <hr class="title-rule" />
    <div class="subtitle">
      <em>Validation and Discovery of Chemokine&ndash;Chemokine Receptor Pairs
      with High-Throughput Protein Modeling</em><br />
      Schlimgen, Kim, Zimmerman, Jensen, Peterson, Szpakowska, Chevign&eacute;, Volkman
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by receptor or chemokine name…" />
      <select id="pairTypeFilter">
        <option value="">All pair types</option>
      </select>
    </div>

    <div id="tableContainer">
      <div class="loading">Loading database…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.15.2/dist/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/table.js"></script>
</body>
</html>
